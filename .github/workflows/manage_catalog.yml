name: Manage Variable Catalog

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Pilih aksi yang ingin dijalankan'
        required: true
        type: choice
        options:
          - explore   # Generate/refresh variable_catalog.csv dari BPS API
          - apply     # Baca variable_catalog.csv dan update domain_vars.json

jobs:
  manage-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 1 (explore): Jelajahi semua variabel BPS dan simpan ke CSV katalog
      - name: Export Katalog Variabel BPS
        if: ${{ github.event.inputs.action == 'explore' }}
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          PYTHONPATH=. python src/explore_variables.py

      # STEP 2 (apply): Baca CSV katalog dan update domain_vars.json
      - name: Apply Selection ke domain_vars.json
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          PYTHONPATH=. python src/apply_selection.py

      # Commit dan push hasil perubahan (CSV atau JSON)
      - name: Commit dan Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/variable_catalog.csv config/domain_vars.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            ACTION="${{ github.event.inputs.action }}"
            if [ "$ACTION" = "explore" ]; then
              git commit -m "Config: Refresh katalog variabel BPS"
            else
              git commit -m "Config: Update domain_vars.json dari pilihan katalog"
            fi
            git push
          fi
