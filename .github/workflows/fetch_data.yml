name: BPS Data Git Scraping

on:
  schedule:
    # Jalan otomatis setiap tanggal 1 jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Memungkinkan untuk di-trigger manual lewat UI GitHub
    inputs:
      regenerate_var_map:
        description: 'Buat ulang mapping var_id per kabupaten (generate_var_map.py)'
        required: false
        type: boolean
        default: false
      explore_variables:
        description: 'Export katalog semua variabel BPS ke CSV (explore_variables.py)'
        required: false
        type: boolean
        default: false
      clean_raw_data:
        description: 'Hapus semua data JSON lama sebelum fetch ulang dari awal'
        required: false
        type: boolean
        default: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Wajib agar bot bisa git push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: (Opsional) Export Katalog Variabel BPS
        if: ${{ github.event.inputs.explore_variables == 'true' }}
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          PYTHONPATH=. python src/explore_variables.py

      - name: (Opsional) Regenerasi Mapping Var ID
        if: ${{ github.event.inputs.regenerate_var_map == 'true' }}
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          PYTHONPATH=. python src/generate_var_map.py

      - name: (Opsional) Bersihkan Data JSON Lama
        if: ${{ github.event.inputs.clean_raw_data == 'true' }}
        run: |
          echo "Menghapus semua data JSON lama..."
          rm -rf data/raw/
          echo "✅ Data lama dihapus. Fetch akan mulai dari awal."

      - name: Fetch BPS Data
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: |
          # Jalankan script fetch
          python fetch_bps.py
          
      - name: Commit and Push Data
        run: |
          # Konfigurasi identitas Git bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan semua perubahan di folder data/ dan README.md
          git add data/ README.md
          
          # Cek apakah ada perubahan (data baru)
          if git diff --staged --quiet; then
            echo "Tidak ada data baru untuk di-commit."
          else
            echo "Data baru ditemukan. Menyimpan ke repository..."
            git commit -m "Automated data fetch: $(date +'%Y-%m-%d')"
            git push
          fi
